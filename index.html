<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3차도 자동차 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        @keyframes roadScroll {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 0 80px;
            }
        }
        .road-stripes {
            background-image: repeating-linear-gradient(
                to bottom,
                #ffffff 0px,
                #ffffff 40px,
                transparent 40px,
                transparent 80px
            );
        }
    </style>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col items-center justify-center overflow-hidden m-0">

    <div id="game-container" class="relative w-full max-w-md h-full max-h-[850px] bg-slate-800 shadow-2xl flex flex-col overflow-hidden border-4 border-slate-700">
        
        <!-- 상단 HUD (속도, 거리, 목표) -->
        <div id="hud" class="absolute top-0 left-0 w-full p-3 flex justify-between items-center z-20 bg-slate-900/85 backdrop-blur-sm border-b border-slate-700 hidden text-xs sm:text-sm">
            <div class="font-bold text-yellow-400 bg-slate-800 px-2.5 py-1 rounded-xl shadow">
                속도: <span id="speed-display">120</span> km/h
            </div>
            <div class="font-bold text-cyan-400 bg-slate-800 px-2.5 py-1 rounded-xl shadow">
                거리: <span id="distance-display">0.000</span> / <span id="target-display">100.000</span> km
            </div>
        </div>

        <!-- 메시지 박스 오버레이 -->
        <div id="message-box" class="absolute top-20 left-1/2 -translate-x-1/2 z-35 bg-amber-500 text-slate-900 font-bold px-6 py-3 rounded-2xl shadow-xl text-lg transition-all duration-300 opacity-0 pointer-events-none text-center">
            메세지 영역
        </div>

        <!-- 도로 영역 -->
        <div id="road" class="relative flex-1 bg-slate-700 overflow-hidden flex">
            <!-- 차선 구분선 -->
            <div id="stripe-1" class="absolute left-1/3 top-0 bottom-0 w-2 road-stripes opacity-70 z-0"></div>
            <div id="stripe-2" class="absolute left-2/3 top-0 bottom-0 w-2 road-stripes opacity-70 z-0"></div>

            <!-- 3개 차도 -->
            <div class="w-1/3 h-full relative" data-lane="0"></div>
            <div class="w-1/3 h-full relative" data-lane="1"></div>
            <div class="w-1/3 h-full relative" data-lane="2"></div>

            <!-- 플레이어 자동차 (하얀 차) -->
            <div id="player-car" class="absolute bottom-10 w-16 h-28 bg-white rounded-2xl shadow-2xl flex flex-col items-center justify-between p-2 z-10 transition-all duration-150">
                <div class="w-12 h-6 bg-slate-900 rounded-t-lg"></div>
                <div class="w-14 h-12 bg-slate-200 rounded-lg"></div>
                <div class="w-12 h-6 bg-slate-900 rounded-b-lg"></div>
            </div>

            <!-- 역주행 차량 컨테이너 -->
            <div id="obstacles-container" class="absolute inset-0 pointer-events-none z-10"></div>
        </div>

        <!-- 시작 및 난이도 선택 화면 -->
        <div id="start-screen" class="absolute inset-0 bg-slate-900/95 z-40 flex flex-col items-center justify-center p-6 text-center">
            <h1 class="text-4xl font-bold mb-6 text-yellow-400 drop-shadow-md">자동차 게임</h1>
            
            <!-- 난이도 선택 박스 -->
            <div class="bg-slate-800 p-6 rounded-3xl border-2 border-slate-700 shadow-xl w-full max-w-xs mb-8">
                <div class="text-sm text-slate-400 mb-2">난이도 선택</div>
                <div class="flex items-center justify-between mb-3">
                    <button id="diff-left" class="text-yellow-400 text-2xl font-bold px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded-xl transition">&larr;</button>
                    <div id="difficulty-label" class="text-2xl font-bold text-green-400 px-4 py-1 rounded-xl">보통</div>
                    <button id="diff-right" class="text-yellow-400 text-2xl font-bold px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded-xl transition">&rarr;</button>
                </div>
                <div id="difficulty-desc" class="text-sm text-slate-300 mt-2">목표: 100.000km</div>
            </div>

            <div class="flex flex-col items-center gap-2">
                <button id="start-btn" class="bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500 text-white text-2xl font-bold px-10 py-4 rounded-2xl shadow-lg transform active:scale-95 transition">
                    시작하기
                </button>
                <div class="text-emerald-400 text-sm font-bold mt-1">보통</div>
            </div>
        </div>

        <!-- 게임 오버 / 재시작 화면 -->
        <div id="gameover-screen" class="absolute inset-0 bg-slate-900/95 z-50 flex-col items-center justify-center p-6 text-center hidden">
            <h2 id="gameover-title" class="text-3xl font-bold mb-4 text-red-500">충돌 발생!</h2>
            
            <!-- 최종 기록 박스 -->
            <div class="bg-slate-800 p-4 rounded-2xl border-2 border-slate-600 mb-4 w-full max-w-xs text-base space-y-2 shadow-2xl">
                <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-lg border border-slate-700">
                    <span class="text-slate-300 font-bold text-sm">이동 거리:</span>
                    <span id="result-distance" class="font-bold text-cyan-400 text-base">0.000 km</span>
                </div>
                <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-lg border border-slate-700">
                    <span class="text-slate-300 font-bold text-sm">최종 속도:</span>
                    <span id="result-speed" class="font-bold text-yellow-400 text-base">140 km/h</span>
                </div>
            </div>

            <!-- 게임오버 화면 난이도 선택 박스 추가 -->
            <div class="bg-slate-800 px-4 py-3 rounded-2xl border-2 border-slate-700 shadow-xl w-full max-w-xs mb-4">
                <div class="text-xs text-slate-400 mb-1">난이도 변경</div>
                <div class="flex items-center justify-between mb-1">
                    <button id="gameover-diff-left" class="text-yellow-400 text-xl font-bold px-3 py-0.5 bg-slate-700 hover:bg-slate-600 rounded-lg transition">&larr;</button>
                    <div id="gameover-difficulty-label" class="text-xl font-bold text-green-400 px-3 py-0.5 rounded-lg">보통</div>
                    <button id="gameover-diff-right" class="text-yellow-400 text-xl font-bold px-3 py-0.5 bg-slate-700 hover:bg-slate-600 rounded-lg transition">&rarr;</button>
                </div>
                <div id="gameover-difficulty-desc" class="text-xs text-slate-300">목표: 100.000km</div>
            </div>

            <button id="restart-btn" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-400 hover:to-indigo-500 text-white text-xl font-bold px-8 py-3 rounded-2xl shadow-lg transform active:scale-95 transition cursor-pointer">
                재시작
            </button>
        </div>

    </div>

    <script>
        let gameState = 'START';
        let currentLane = 1;
        let distance = 0;
        let speed = 120;
        let obstacles = [];
        let lastFrameTime = 0;
        
        let currentDiffIndex = 0;
        const difficulties = [
            { name: '보통', target: 100, color: 'text-green-400', unlocked: true },
            { name: '어려움', target: 500, color: 'text-red-500', unlocked: false },
            { name: '지옥', target: 1000, color: 'text-purple-400', unlocked: false }
        ];

        let triggeredMilestones = {};
        let lastRandomMessageKm = 0;
        const randomMessages = [
            "운전 실력이 제법인데요?",
            "졸음운전은 절대 안 됩니다!",
            "좋은 노래를 들으며 달리는 중~",
            "앞 차량을 조심하세요!",
            "날씨가 아주 화창하네요!",
            "조금만 더 힘내세요, 거의 다 왔어요!"
        ];

        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const hud = document.getElementById('hud');
        const distanceDisplay = document.getElementById('distance-display');
        const targetDisplay = document.getElementById('target-display');
        const speedDisplay = document.getElementById('speed-display');
        
        const resultDistance = document.getElementById('result-distance');
        const resultSpeed = document.getElementById('result-speed');

        const playerCar = document.getElementById('player-car');
        const obstaclesContainer = document.getElementById('obstacles-container');
        const messageBox = document.getElementById('message-box');
        
        const diffLabel = document.getElementById('difficulty-label');
        const diffDesc = document.getElementById('difficulty-desc');
        const diffLeft = document.getElementById('diff-left');
        const diffRight = document.getElementById('diff-right');

        // 게임오버 화면용 난이도 DOM 요소
        const gameoverDiffLabel = document.getElementById('gameover-difficulty-label');
        const gameoverDiffDesc = document.getElementById('gameover-difficulty-desc');
        const gameoverDiffLeft = document.getElementById('gameover-diff-left');
        const gameoverDiffRight = document.getElementById('gameover-diff-right');

        const gameoverTitle = document.getElementById('gameover-title');
        const road = document.getElementById('road');
        const stripe1 = document.getElementById('stripe-1');
        const stripe2 = document.getElementById('stripe-2');

        function updateDifficultyUI() {
            const diff = difficulties[currentDiffIndex];
            
            // 시작 화면 UI 업데이트
            diffLabel.innerText = diff.name;
            diffLabel.className = `text-2xl font-bold px-4 py-1 rounded-xl ${diff.color}`;
            
            // 게임오버 화면 UI 업데이트
            gameoverDiffLabel.innerText = diff.name;
            gameoverDiffLabel.className = `text-xl font-bold px-3 py-0.5 rounded-lg ${diff.color}`;

            if (!diff.unlocked) {
                diffLabel.innerHTML = `${diff.name} 🔒`;
                gameoverDiffLabel.innerHTML = `${diff.name} 🔒`;
                diffDesc.innerText = `이전 난이도를 클리어해야 해제됩니다.\n목표: ${diff.target}.000 km`;
                gameoverDiffDesc.innerText = `잠김 (목표: ${diff.target}km)`;
                startBtn.disabled = true;
                startBtn.classList.add('opacity-50', 'cursor-not-allowed');
                restartBtn.disabled = true;
                restartBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                diffDesc.innerText = `목표 거리: ${diff.target}.000 km`;
                gameoverDiffDesc.innerText = `목표 거리: ${diff.target}.000 km`;
                startBtn.disabled = false;
                startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                restartBtn.disabled = false;
                restartBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        diffLeft.addEventListener('click', () => {
            currentDiffIndex--;
            if (currentDiffIndex < 0) currentDiffIndex = difficulties.length - 1;
            updateDifficultyUI();
        });

        diffRight.addEventListener('click', () => {
            currentDiffIndex++;
            if (currentDiffIndex >= difficulties.length) currentDiffIndex = 0;
            updateDifficultyUI();
        });

        // 게임오버 화면 난이도 변경 버튼 이벤트 리스너 추가
        gameoverDiffLeft.addEventListener('click', () => {
            currentDiffIndex--;
            if (currentDiffIndex < 0) currentDiffIndex = difficulties.length - 1;
            updateDifficultyUI();
        });

        gameoverDiffRight.addEventListener('click', () => {
            currentDiffIndex++;
            if (currentDiffIndex >= difficulties.length) currentDiffIndex = 0;
            updateDifficultyUI();
        });

        function updatePlayerPosition() {
            const roadWidth = road.clientWidth;
            const laneWidth = roadWidth / 3;
            const targetLeft = (currentLane * laneWidth) + (laneWidth / 2) - (playerCar.clientWidth / 2);
            playerCar.style.left = `${targetLeft}px`;
        }

        window.addEventListener('resize', () => {
            updatePlayerPosition();
        });

        window.addEventListener('keydown', (e) => {
            if (gameState !== 'PLAYING') return;
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                if (currentLane > 0) {
                    currentLane--;
                    updatePlayerPosition();
                }
            } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                if (currentLane < 2) {
                    currentLane++;
                    updatePlayerPosition();
                }
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;
        road.addEventListener('touchstart', (e) => {
            if (gameState !== 'PLAYING') return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: true});

        road.addEventListener('touchend', (e) => {
            if (gameState !== 'PLAYING') return;
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;
            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30) {
                    if (currentLane < 2) {
                        currentLane++;
                        updatePlayerPosition();
                    }
                } else if (diffX < -30) {
                    if (currentLane > 0) {
                        currentLane--;
                        updatePlayerPosition();
                    }
                }
            } else {
                const roadRect = road.getBoundingClientRect();
                const tapX = touchEndX - roadRect.left;
                if (tapX < roadRect.width / 2) {
                    if (currentLane > 0) {
                        currentLane--;
                        updatePlayerPosition();
                    }
                } else {
                    if (currentLane < 2) {
                        currentLane++;
                        updatePlayerPosition();
                    }
                }
            }
        }, {passive: true});

        let messageTimeout = null;
        function showMessage(text) {
            messageBox.innerText = text;
            messageBox.style.opacity = '1';
            
            if (messageTimeout) clearTimeout(messageTimeout);
            messageTimeout = setTimeout(() => {
                messageBox.style.opacity = '0';
            }, 3000);
        }

        startBtn.addEventListener('click', () => {
            const diff = difficulties[currentDiffIndex];
            if (!diff.unlocked) return;
            
            startScreen.classList.add('hidden');
            hud.classList.remove('hidden');
            initGame();
        });

        restartBtn.addEventListener('click', () => {
            const diff = difficulties[currentDiffIndex];
            if (!diff.unlocked) return;

            gameOverScreen.classList.add('hidden');
            gameOverScreen.classList.remove('flex');
            hud.classList.remove('hidden');
            initGame();
        });

        function initGame() {
            gameState = 'PLAYING';
            currentLane = 1;
            distance = 0;
            speed = 120;
            obstacles = [];
            obstaclesContainer.innerHTML = '';
            triggeredMilestones = {};
            lastRandomMessageKm = 0;
            updatePlayerPosition();
            speedDisplay.innerText = Math.floor(speed);
            targetDisplay.innerText = `${difficulties[currentDiffIndex].target}.000`;
            lastFrameTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        let spawnTimer = 0;
        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;

            const deltaTime = (timestamp - lastFrameTime) / 1000;
            lastFrameTime = timestamp;

            const currentDiff = difficulties[currentDiffIndex];
            const targetDist = currentDiff.target;
            
            speed = 120 + (distance / targetDist) * 160;

            const progressRatio = distance / targetDist;
            const animDuration = Math.max(0.03, 0.35 - (progressRatio * 0.25));
            stripe1.style.animation = `roadScroll ${animDuration}s linear infinite`;
            stripe2.style.animation = `roadScroll ${animDuration}s linear infinite`;

            const metersThisFrame = (speed * 1.2) * deltaTime * 3.6;
            distance += (metersThisFrame / 1000); 
            
            distanceDisplay.innerText = distance.toFixed(3);
            speedDisplay.innerText = Math.floor(speed);

            checkMilestones(distance, currentDiff.name);

            if (Math.floor(distance / 400) > Math.floor(lastRandomMessageKm / 400)) {
                lastRandomMessageKm = distance;
                const randomMsg = randomMessages[Math.floor(Math.random() * randomMessages.length)];
                showMessage(randomMsg);
            }

            if (distance >= targetDist) {
                endGame(true);
                return;
            }

            spawnTimer += deltaTime;
            let spawnInterval = Math.max(0.42, 1.4 - (progressRatio * 0.8));
            if (spawnTimer > spawnInterval) {
                spawnTimer = 0;
                spawnObstacle();
            }

            updateObstacles(deltaTime);

            if (checkCollision()) {
                endGame(false);
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        function checkMilestones(dist, diffName) {
            if (diffName === '보통') {
                if (dist >= 50 && dist < 53 && !triggeredMilestones[50]) {
                    triggeredMilestones[50] = true;
                    showMessage("휴 절반 왔다");
                }
                if (dist >= 90 && dist < 93 && !triggeredMilestones[90]) {
                    triggeredMilestones[90] = true;
                    showMessage("거의 다왔다!");
                }
            } else if (diffName === '어려움') {
                if (dist >= 250 && dist < 253 && !triggeredMilestones[250]) {
                    triggeredMilestones[250] = true;
                    showMessage("휴 절반 왔다");
                }
                if (dist >= 450 && dist < 453 && !triggeredMilestones[450]) {
                    triggeredMilestones[450] = true;
                    showMessage("거의 다왔다!");
                }
            } else if (diffName === '지옥') {
                if (dist >= 500 && dist < 503 && !triggeredMilestones[500]) {
                    triggeredMilestones[500] = true;
                    showMessage("휴 절반 왔다");
                }
                if (dist >= 900 && dist < 903 && !triggeredMilestones[900]) {
                    triggeredMilestones[900] = true;
                    showMessage("거의 다왔다!");
                }
            }
        }

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 3);
            const roadWidth = road.clientWidth;
            const laneWidth = roadWidth / 3;
            const leftPos = (lane * laneWidth) + (laneWidth / 2) - 24;

            const colors = ['bg-red-500', 'bg-blue-500', 'bg-yellow-500', 'bg-purple-500', 'bg-emerald-500'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            const obsEl = document.createElement('div');
            obsEl.className = `absolute w-12 h-24 ${randomColor} rounded-xl shadow-lg flex flex-col items-center justify-between p-1 z-10`;
            obsEl.style.left = `${leftPos}px`;
            obsEl.style.top = `-100px`;

            obsEl.innerHTML = `
                <div class="w-8 h-4 bg-slate-900 rounded-t"></div>
                <div class="w-10 h-8 bg-slate-800 rounded"></div>
                <div class="w-8 h-4 bg-slate-900 rounded-b"></div>
            `;

            obstaclesContainer.appendChild(obsEl);

            obstacles.push({
                element: obsEl,
                lane: lane,
                top: -100,
                speedMultiplier: 0.65 
            });
        }

        function updateObstacles(deltaTime) {
            const moveSpeed = 480 * deltaTime;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.top += moveSpeed * obs.speedMultiplier;
                obs.element.style.top = `${obs.top}px`;

                if (obs.top > road.clientHeight + 100) {
                    obs.element.remove();
                    obstacles.splice(i, 1);
                }
            }
        }

        function checkCollision() {
            const playerRect = playerCar.getBoundingClientRect();
            
            for (let obs of obstacles) {
                const obsRect = obs.element.getBoundingClientRect();
                const padding = 12;
                if (
                    playerRect.left + padding < obsRect.right - padding &&
                    playerRect.right - padding > obsRect.left + padding &&
                    playerRect.top + padding < obsRect.bottom - padding &&
                    playerRect.bottom - padding > obsRect.top + padding
                ) {
                    return true;
                }
            }
            return false;
        }

        function endGame(isWin) {
            gameState = 'GAMEOVER';
            
            const finalDistText = distance.toFixed(3) + " km";
            const finalSpeedText = Math.floor(speed) + " km/h";

            hud.classList.add('hidden');
            
            resultDistance.innerText = finalDistText;
            resultSpeed.innerText = finalSpeedText;
            
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex');

            const currentDiff = difficulties[currentDiffIndex];

            if (isWin) {
                gameoverTitle.innerText = "도착이다!!";
                gameoverTitle.className = "text-3xl font-bold mb-4 text-yellow-400";
                
                if (currentDiffIndex === 0) {
                    difficulties[1].unlocked = true;
                } else if (currentDiffIndex === 1) {
                    difficulties[2].unlocked = true;
                }
                updateDifficultyUI();
            } else {
                gameoverTitle.innerText = "충돌 발생!";
                gameoverTitle.className = "text-3xl font-bold mb-4 text-red-500";
            }
        }

        updateDifficultyUI();
    </script>
</body>
</html>
